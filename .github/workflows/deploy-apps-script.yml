name: Publicar Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Validar Apps Script
        working-directory: apps-script
        run: |
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json','utf8')); new Function(require('fs').readFileSync('Code.gs','utf8')); console.log('Apps Script syntax OK')"

      - name: Autenticar clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Publicar código e criar versão
        working-directory: apps-script
        env:
          GITHUB_SHA: ${{ github.sha }}
          WEB_APP_DEPLOYMENT_ID: ${{ vars.APPSSCRIPT_WEB_APP_DEPLOYMENT_ID }}
        run: |
          test -n "$WEB_APP_DEPLOYMENT_ID"
          npx --yes @google/clasp@3.3.0 push --force
          VERSION=$(npx --yes @google/clasp@3.3.0 version "GitHub ${GITHUB_SHA:0:7}" | sed -nE 's/.*version ([0-9]+).*/\1/p' | tail -1)
          test -n "$VERSION"
          npx --yes @google/clasp@3.3.0 deploy --deploymentId "$WEB_APP_DEPLOYMENT_ID" --versionNumber "$VERSION" --description "GitHub ${GITHUB_SHA:0:7}"
