name: Publicar Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar Apps Script
        working-directory: apps-script
        run: |
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json','utf8')); new Function(require('fs').readFileSync('Code.gs','utf8')); console.log('Apps Script syntax OK')"

      - name: Autenticar clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Publicar código e criar versão
        working-directory: apps-script
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npx --yes @google/clasp push --force
          VERSION=$(npx --yes @google/clasp version "GitHub ${GITHUB_SHA:0:7}" | sed -nE 's/.*version ([0-9]+).*/\1/p' | tail -1)
          test -n "$VERSION"
          npx --yes @google/clasp deploy --versionNumber "$VERSION" --description "GitHub ${GITHUB_SHA:0:7}"
